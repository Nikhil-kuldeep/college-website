<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Notes</title>

    <style>
        :root {
            --primary: #6366f1;
            --secondary: #8b5cf6;
            --dark: #111827;
            --text: #374151;
            --light: #f8fafc;
            --border: #e5e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f8fafc, #eef2ff);
            color: var(--text);
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            width: 100%;
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
        }

        .logout-btn {
            border: none;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--secondary)
            );
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        /* MAIN */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 34px;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6b7280;
            font-size: 15px;
        }

        /* NOTES GRID */

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 22px;
        }

        .note-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
            transition: 0.3s;
            animation: fadeIn 0.5s ease;
        }

        .note-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .note-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(99, 102, 241, 0.1);
            font-size: 25px;
            margin-bottom: 15px;
        }

        .note-title {
            font-size: 19px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .note-subject {
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .note-description {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            min-height: 45px;
            margin-bottom: 18px;
        }

        /* BOTTOM */

        .note-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        .date {
            color: #9ca3af;
            font-size: 12px;
        }

        /* READ BUTTON */

        .note-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .read-btn {
            text-decoration: none;
            padding: 9px 16px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 700;
            transition: 0.3s;
            display: inline-block;
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary);
        }

        .read-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.04);
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e5e7eb;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        /* EMPTY */

        .empty {
            text-align: center;
            background: white;
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        /* ERROR */

        .error {
            text-align: center;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 20px;
        }

        /* ANIMATIONS */

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 5%;
            }

            .logo {
                font-size: 20px;
            }

            .container {
                width: 90%;
                margin: 30px auto;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .notes-grid {
                grid-template-columns: 1fr;
            }

            .note-bottom {
                align-items: flex-start;
                flex-direction: column;
            }

            .note-actions {
                width: 100%;
            }

            .read-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            📚 College Notes
        </div>

        <button class="logout-btn" onclick="logout()">
            Logout
        </button>

    </nav>


    <!-- MAIN -->

    <main class="container">

        <div class="page-header">

            <h1>
                Available Notes
            </h1>

            <p>
                Read your college study material online.
            </p>

        </div>


        <!-- NOTES -->

        <div id="notesContainer">

            <div class="loading">

                <div class="spinner"></div>

                <p>
                    Loading notes...
                </p>

            </div>

        </div>

    </main>


    <script>

        /* LOAD NOTES */

        async function loadNotes() {

            const container =
                document.getElementById("notesContainer");

            try {

                const response =
                    await fetch("/api/notes");

                if (response.status === 401) {

                    window.location.href = "/login.html";

                    return;
                }

                const data =
                    await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Unable to load notes"
                    );

                }

                const notes = data.notes || data;

                displayNotes(notes);

            }

            catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="error">

                        ❌ Unable to load notes.

                        <br><br>

                        ${error.message}

                    </div>

                `;

            }

        }


        /* DISPLAY NOTES */

        function displayNotes(notes) {

            const container =
                document.getElementById("notesContainer");


            if (!notes || notes.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📚
                        </div>

                        <h2>
                            No Notes Available
                        </h2>

                        <p>
                            Notes will appear here when the admin uploads them.
                        </p>

                    </div>

                `;

                return;
            }


            container.innerHTML = `

                <div class="notes-grid">

                    ${notes.map(note => {

                        const date =
                            note.created_at
                                ? new Date(note.created_at)
                                    .toLocaleDateString("en-IN", {
                                        day: "2-digit",
                                        month: "short",
                                        year: "numeric"
                                    })
                                : "Date not available";


                        return `

                            <div class="note-card">

                                <div class="note-icon">
                                    📄
                                </div>


                                <div class="note-title">
                                    ${escapeHTML(note.title)}
                                </div>


                                <div class="note-subject">
                                    ${escapeHTML(note.subject || "Study Notes")}
                                </div>


                                <div class="note-description">
                                    ${escapeHTML(
                                        note.description ||
                                        "College study notes"
                                    )}
                                </div>


                                <div class="note-bottom">

                                    <span class="date">
                                        📅 ${date}
                                    </span>


                                    <div class="note-actions">

                                        <a
                                            class="read-btn"
                                            href="/api/notes/download/${note.id}"
                                            target="_blank"
                                            rel="noopener noreferrer"
                                        >
                                            📖 Read
                                        </a>

                                    </div>

                                </div>

                            </div>

                        `;

                    }).join("")}

                </div>

            `;

        }


        /* SECURITY */

        function escapeHTML(value) {

            if (value === null || value === undefined) {
                return "";
            }

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* LOGOUT */

        async function logout() {

            try {

                await fetch("/api/auth/logout", {
                    method: "POST"
                });

            }

            catch (error) {

                console.error(error);

            }

            window.location.href = "/login.html";

        }


        /* START */

        loadNotes();

    </script>

</body>
</html>
